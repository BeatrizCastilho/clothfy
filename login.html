<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login | Atelier Lux</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div class="box-auth">
        <h2>Autenticação</h2>
        <p style="color: var(--texto-mutado); font-size: 0.85rem; margin-bottom: 30px;">Gerencie seus pedidos e personalizações.</p>
        <form id="form-login">
            <div class="input-group">
                <label>E-mail</label>
                <input type="email" id="log-email" required>
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="log-senha" required>
            </div>
            <button type="submit" class="btn-lux" style="width: 100%;">Entrar</button>
        </form>
        <p style="margin-top: 20px; font-size: 0.8rem; text-align: center; color: var(--texto-mutado);">Não tem conta? <a href="cadastro.html" style="color: var(--dourado);">Registre-se</a></p>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
